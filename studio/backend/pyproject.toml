[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-ops-studio-backend"
version = "0.8.0"
description = "Thin orchestration API for Fabric Ops Studio"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7"
]

[project.scripts]
fabric-ops-studio-api = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["*.json"]
