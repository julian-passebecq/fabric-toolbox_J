schema_version: 1
product: Fabric Ops Studio

principles:
  - Prefer upstream MicrosoftFabricMgmt PowerShell commands.
  - Prefer official Fabric REST APIs when PowerShell coverage is missing.
  - Wrap specialized Fabric Toolbox tools instead of copying their internals.
  - Keep Studio-owned orchestration thin and explicit.
  - Every executable capability must declare provenance and risk.
  - Distinguish the feature provider from the execution transport.
  - Fabric REST capabilities are registered from verified official endpoints, never accepted as arbitrary URLs.

sources:
  - id: microsoftfabricmgmt
    name: MicrosoftFabricMgmt PowerShell module
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/MicrosoftFabricMgmt
    integration: wrapped-local-module
    update_strategy: merge-upstream-main
    role: primary-feature-provider
    capability_scope:
      - admin
      - capacities
      - connections
      - workspaces
      - items
      - pipelines
      - deployment-pipelines
      - notebooks
      - lakehouses
      - warehouses
      - sql-databases
      - environments
    studio_modifies_upstream: false

  - id: microsoftfabricmgmt-session-runtime
    name: MicrosoftFabricMgmt persistent PowerShell session
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/MicrosoftFabricMgmtMCPServer/core/powershell_session.py
    integration: dynamic-runtime-import
    update_strategy: merge-upstream-main
    role: execution-transport-only
    feature_source: false
    note: Studio reuses the upstream session/process transport but capability provenance remains the originating cmdlet or official Fabric REST API.
    studio_modifies_upstream: false

  - id: fabric-rest
    name: Microsoft Fabric REST API
    origin: microsoft-official-api
    owner: microsoft
    integration: registered-endpoints-via-microsoftfabricmgmt
    execution_transport: MicrosoftFabricMgmt.Invoke-FabricAPIRequest
    authentication_transport: MicrosoftFabricMgmt.Get-FabricAPIHeaders
    update_strategy: verify-official-api-then-update-registry
    role: official-api-feature-provider
    capability_scope:
      - generic-items
      - job-instances
      - schedules
    safety:
      current_methods:
        - GET
      arbitrary_urls: false
    studio_modifies_upstream: false

  - id: fabric-security-audit
    name: Fabric Security Audit
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/fabric-security-audit
    integration: subprocess-wrapper
    update_strategy: merge-upstream-main
    role: specialized-tool
    studio_modifies_upstream: false

  - id: fabric-assessment-tool
    name: Fabric Assessment Tool
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/fabric-assessment-tool
    integration: python-package-wrapper
    update_strategy: merge-upstream-main
    role: specialized-tool
    studio_modifies_upstream: false

  - id: lineage-extractor
    name: Fabric Lineage Extractor
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/Lineage_Extractor
    integration: notebook-tool-wrapper
    update_strategy: merge-upstream-main
    role: specialized-tool
    studio_modifies_upstream: false

excluded_from_product_surface:
  - id: dax-performance-tuner
    reason: DAX work belongs in DAX Studio / specialist tooling.
  - id: semantic-model-mcp
    reason: Semantic model authoring belongs in Tabular Editor / specialist tooling.
  - id: powerbi-modeling-mcp
    reason: Model authoring is out of scope.
  - id: fabric-report-mcp
    reason: Report authoring is out of scope.
  - id: power-bi-agentic-development
    reason: Report/model development is out of scope.
