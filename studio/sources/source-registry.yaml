schema_version: 1
sources:
  - id: microsoftfabricmgmt
    name: MicrosoftFabricMgmt PowerShell module
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/MicrosoftFabricMgmt
    integration: wrapped-local-module
    license: MIT
    update_strategy: merge-upstream-main
    stability: upstream
    role: primary
    notes: Primary execution backend for Fabric management operations. Studio should wrap commands rather than duplicate them.

  - id: microsoftfabricmgmt-mcp
    name: MicrosoftFabricMgmt MCP Server
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/MicrosoftFabricMgmtMCPServer
    integration: optional-adapter
    license: MIT
    update_strategy: merge-upstream-main
    stability: upstream
    role: optional
    notes: Useful as an AI/client adapter but not required for deterministic Studio UI operations.

  - id: fabric-rest-api
    name: Microsoft Fabric REST API
    origin: microsoft-official-api
    documentation: https://learn.microsoft.com/rest/api/fabric/
    integration: direct-rest
    license: documentation-and-service-terms
    update_strategy: track-official-api
    stability: mixed
    role: fallback
    notes: Use when a required operation is not yet exposed cleanly by MicrosoftFabricMgmt.

  - id: fabric-security-audit
    name: Fabric Security Audit
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/fabric-security-audit
    integration: wrapped-tool
    update_strategy: merge-upstream-main
    stability: upstream
    role: specialized
    notes: Specialized security and effective-access troubleshooting workflow.

  - id: fabric-assessment-tool
    name: Fabric Assessment Tool
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/fabric-assessment-tool
    integration: wrapped-tool
    update_strategy: merge-upstream-main
    stability: upstream
    role: specialized
    notes: Migration and environment assessment workflow.

  - id: lineage-extractor
    name: Fabric Lineage Extractor
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/Lineage_Extractor
    integration: wrapped-tool
    update_strategy: merge-upstream-main
    stability: upstream
    role: specialized
    notes: Metadata and column-level lineage extraction; use for operational impact views, not report authoring.

  - id: sql-database-rest-powershell-sample
    name: SQL Database REST + PowerShell recipe
    origin: microsoft-learn
    documentation: https://learn.microsoft.com/fabric/database/sql/create-rest-api
    integration: recipe
    update_strategy: track-official-doc
    stability: official-documentation
    role: recipe
    notes: Pattern for exposing a friendly UI together with the exact PowerShell/REST recipe and prerequisites.

excluded_sources:
  - id: dax-performance-tuner
    reason: Out of product scope; DAX optimization belongs in DAX Studio/other dedicated tools.
  - id: semantic-model-mcp
    reason: Semantic model authoring is out of product scope; Tabular Editor covers this area.
  - id: powerbi-modeling-mcp
    reason: Power BI semantic-model development is out of product scope.
  - id: fabric-report-mcp
    reason: Report authoring/editing is out of product scope.
  - id: power-bi-agentic-development
    reason: Report/DAX development workflows are out of product scope.
