schema_version: 1
product: Fabric Ops Studio

principles:
  - Prefer upstream MicrosoftFabricMgmt PowerShell commands.
  - Prefer official Fabric REST APIs when PowerShell coverage is missing.
  - Wrap or expose specialized Fabric Toolbox tools instead of copying their internals.
  - Keep Studio-owned orchestration thin and explicit.
  - Every executable capability must declare provenance and risk.
  - Distinguish the feature provider from the execution transport.
  - Fabric REST capabilities are registered from verified official endpoints, never accepted as arbitrary URLs.
  - Delegate Fabric long-running-operation polling to MicrosoftFabricMgmt rather than implementing a second poller.
  - Mutating operations are blocked by default and require an explicit guarded-write allowlist entry.
  - Guarded writes are tenant-bound, expiring, hash-bound, single-use plans with typed approval and upstream validation when available.

sources:
  - id: microsoftfabricmgmt
    name: MicrosoftFabricMgmt PowerShell module
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/MicrosoftFabricMgmt
    integration: wrapped-local-module
    update_strategy: merge-upstream-main
    role: primary-feature-provider
    capability_scope:
      - admin
      - capacities
      - connections
      - workspaces
      - workspace-role-assignments
      - items
      - pipelines
      - deployment-pipelines
      - notebooks
      - lakehouses
      - warehouses
      - sql-databases
      - environments
    guarded_write_scope:
      - New-FabricWorkspace
      - Update-FabricWorkspace
    guarded_write_note: Only these explicitly curated cmdlets are executable as writes in Studio v0.5. Both support upstream ShouldProcess/-WhatIf. Other discovered write/admin/destructive commands remain blocked.
    studio_modifies_upstream: false

  - id: microsoftfabricmgmt-session-runtime
    name: MicrosoftFabricMgmt persistent PowerShell session
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/MicrosoftFabricMgmtMCPServer/core/powershell_session.py
    integration: dynamic-runtime-import
    update_strategy: merge-upstream-main
    role: execution-transport-only
    feature_source: false
    note: Studio reuses the upstream session/process transport but capability provenance remains the originating cmdlet or official Fabric REST API.
    studio_modifies_upstream: false

  - id: studio-guarded-write-broker
    name: Fabric Ops Studio guarded write broker
    origin: studio-owned
    owner: julian-passebecq/fabric-toolbox_J
    local_path: studio/backend/app/mutations.py
    integration: orchestration-only
    update_strategy: studio-branch
    role: safety-orchestration
    feature_source: false
    execution_transport: MicrosoftFabricMgmt persistent PowerShell session
    safety:
      default_write_policy: blocked
      plan_ttl_minutes: 10
      tenant_bound: true
      digest: SHA-256
      typed_confirmation: true
      single_use: true
      upstream_whatif_required_when_registered: true
      read_back_verification: true
    note: The broker does not reimplement Fabric management calls. It binds an exact upstream command and parameters to an expiring plan, validates through upstream -WhatIf where available, requires explicit typed approval, executes once, and performs a read-back when configured.

  - id: fabric-rest
    name: Microsoft Fabric REST API
    origin: microsoft-official-api
    owner: microsoft
    integration: registered-endpoints-via-microsoftfabricmgmt
    execution_transport: MicrosoftFabricMgmt.Invoke-FabricAPIRequest
    authentication_transport: MicrosoftFabricMgmt.Get-FabricAPIHeaders
    lro_transport: MicrosoftFabricMgmt.Invoke-FabricAPIRequest -WaitForCompletion -> Get-FabricLongRunningOperation -> Get-FabricLongRunningOperationResult
    update_strategy: verify-official-api-then-update-registry
    role: official-api-feature-provider
    capability_scope:
      - generic-items
      - item-details
      - item-connections
      - job-instances
      - schedules
      - workspace-git-status
    safety:
      current_methods:
        - GET
      arbitrary_urls: false
      lro_implementation: upstream-module
      writes: blocked
    studio_modifies_upstream: false

  - id: fabric-security-audit
    name: Fabric Security Audit
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/fabric-security-audit
    integration: catalogued-upstream-workflow
    execution_status: preview-only
    update_strategy: merge-upstream-main
    role: specialized-tool
    note: Studio shows prerequisites and the upstream entrypoint. Generic execution is intentionally disabled because the workflow spans Fabric, Graph and SQL security and creates output bundles.
    studio_modifies_upstream: false

  - id: fabric-assessment-tool
    name: Fabric Assessment Tool
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/fabric-assessment-tool
    integration: catalogued-upstream-workflow
    execution_status: preview-only
    update_strategy: merge-upstream-main
    role: specialized-tool
    note: Studio exposes the fat assessment workflow but does not duplicate its Python package, Azure CLI or Fabric Notebook authentication lifecycle.
    studio_modifies_upstream: false

  - id: lineage-extractor
    name: Fabric Lineage Extractor
    origin: microsoft-fabric-toolbox
    owner: microsoft
    repository: microsoft/fabric-toolbox
    local_path: tools/Lineage_Extractor
    integration: catalogued-upstream-workflow
    execution_status: external-notebook
    update_strategy: merge-upstream-main
    role: specialized-tool
    note: The upstream implementation is a Fabric notebook workflow and can publish lineage to Purview; Studio exposes instructions and provenance rather than running notebook cells locally.
    studio_modifies_upstream: false

excluded_from_product_surface:
  - id: dax-performance-tuner
    reason: DAX work belongs in DAX Studio / specialist tooling.
  - id: semantic-model-mcp
    reason: Semantic model authoring belongs in Tabular Editor / specialist tooling.
  - id: powerbi-modeling-mcp
    reason: Model authoring is out of scope.
  - id: fabric-report-mcp
    reason: Report authoring is out of scope.
  - id: power-bi-agentic-development
    reason: Report/model development is out of scope.
