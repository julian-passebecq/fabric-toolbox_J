name: Fabric Ops Studio CI

on:
  push:
    branches: [fabric-ops-studio-v1]
    paths:
      - 'studio/**'
      - '.github/workflows/studio-ci.yml'
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e studio/backend pytest
      - name: Compile backend
        run: python -m compileall studio/backend/app
      - name: Test capability discovery
        working-directory: studio/backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: studio
        run: npm install
      - name: Build frontend
        working-directory: studio
        run: npm run build
