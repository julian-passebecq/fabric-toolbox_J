name: Fabric Ops Studio CI

on:
  push:
    branches: [fabric-ops-studio-v1, 'codex/**']
    paths:
      - 'studio/**'
      - 'tools/MicrosoftFabricMgmt/**'
      - 'tools/MicrosoftFabricMgmtMCPServer/**'
      - 'tools/fabric-security-audit/**'
      - 'tools/fabric-assessment-tool/**'
      - 'tools/Lineage_Extractor/**'
      - '.github/workflows/studio-ci.yml'
  pull_request:
    paths:
      - 'studio/**'
      - 'tools/MicrosoftFabricMgmt/**'
      - 'tools/MicrosoftFabricMgmtMCPServer/**'
      - 'tools/fabric-security-audit/**'
      - 'tools/fabric-assessment-tool/**'
      - 'tools/Lineage_Extractor/**'
      - '.github/workflows/studio-ci.yml'

concurrency:
  group: fabric-ops-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install locked backend
        run: |
          python -m pip install -r studio/backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e studio/backend
      - name: Compile and test backend, provider subprocesses, API, and launcher
        run: |
          python -m compileall -q studio/backend/app studio/scripts
          python -m pytest -q studio/backend/tests
      - name: Install locked frontend
        working-directory: studio
        run: npm ci
      - name: Component tests and build
        working-directory: studio
        run: |
          npm run test -w frontend -- --run
          npm run build
      - name: Install browser
        working-directory: studio/frontend
        run: npx playwright install --with-deps chromium
      - name: Real local proxy and browser smoke
        working-directory: studio
        env:
          STUDIO_TEST_PYTHON: python
        run: npm run test:e2e -w frontend
      - name: Windows launcher install, readiness, and cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./studio/scripts/start-studio.ps1 -NoBrowser -SmokeTest -PythonPath python
          ./studio/scripts/start-studio.ps1 -NoBrowser -SkipInstall -SmokeTest -PythonPath python
